blueprint:
  name: Boosted Heating Sync
  description: >-
    Synchronizes one or more target heaters with a master thermostat by applying
    a per-heater boosted temperature offset (based on the difference between the
    master thermostat's target and current temperatures) on top of each target
    heater's own current temperature.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    master_thermostat:
      name: Master thermostat
      description: >-
        The main room thermostat whose target temperature and current
        temperature determine the heating demand (temperature difference).
      selector:
        entity:
          domain: climate
          multiple: false
    target_heaters:
      name: Target heaters
      description: >-
        All heater climate entities to control. Each heater uses its own
        current_temperature plus its boosted offset.
      selector:
        entity:
          domain: climate
          multiple: true
    default_boost_multiplier:
      name: Default boost multiplier
      description: >-
        Default multiplier applied to the master thermostat's temperature
        difference for any heater not listed in the per-heater overrides below
        (e.g., 4 means a 1°C deficit on the master thermostat boosts the heater
        target by +4°C above that heater's current_temperature).
      default: 4
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          mode: slider
    heater_boost_overrides:
      name: Per-heater boost overrides
      description: >-
        (Optional) Dictionary mapping specific heater entity IDs to custom boost
        multipliers. Example: `climate.panelovn_stue: 4` or
        `climate.panelovn_kjokken: 2.5`. Heaters not listed here will use the
        Default boost multiplier above.
      default: {}
      selector:
        object:
    heater_cooldown_seconds:
      name: Heater sensor cooldown
      description: >-
        Minimum time (in seconds) that a change in a target heater's
        current_temperature must remain stable before triggering a recalculation
        (helps avoid rapid feedback loops as the heater warms up).
      default: 60
      selector:
        number:
          min: 0
          max: 600
          step: 10
          unit_of_measurement: s
          mode: slider
    change_threshold:
      name: Minimum temperature change threshold
      description: >-
        Minimum difference (in °C) required between the newly calculated target
        temperature and the heater's current setpoint before sending a
        climate.set_temperature command.
      default: 0.1
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

mode: single
max_exceeded: silent

trigger:
  - id: master_current
    platform: state
    entity_id: !input master_thermostat
    attribute: current_temperature
  - id: master_target
    platform: state
    entity_id: !input master_thermostat
    attribute: temperature
  - id: heater_current
    platform: state
    entity_id: !input target_heaters
    attribute: current_temperature
    for:
      seconds: !input heater_cooldown_seconds

variables:
  master_thermostat: !input master_thermostat
  target_heaters: !input target_heaters
  default_boost_multiplier: !input default_boost_multiplier
  change_threshold: !input change_threshold
  _heater_boost_overrides: !input heater_boost_overrides
  heater_boost_overrides: >-
    {{ _heater_boost_overrides if _heater_boost_overrides is mapping else {} }}
  master_target_temp: "{{ state_attr(master_thermostat, 'temperature') }}"
  master_current_temp: "{{ state_attr(master_thermostat, 'current_temperature') }}"

condition:
  - alias: Ensure master thermostat temperature attributes are valid numbers
    condition: template
    value_template: >-
      {{ master_target_temp is number and master_current_temp is number }}

action:
  - variables:
      actual_diff: "{{ (master_target_temp | float) - (master_current_temp | float) }}"
  - repeat:
      for_each: "{{ target_heaters }}"
      sequence:
        - variables:
            heater_entity: "{{ repeat.item }}"
            heater_current_temp: "{{ state_attr(heater_entity, 'current_temperature') }}"
            heater_boost: >-
              {{ heater_boost_overrides.get(heater_entity, default_boost_multiplier)
                 | float(default_boost_multiplier | float) }}
            boosted_diff: >-
              {{ ((actual_diff | float) * (heater_boost | float)) | round(0) }}
            min_temp: "{{ state_attr(heater_entity, 'min_temp') | float(5) }}"
            max_temp: "{{ state_attr(heater_entity, 'max_temp') | float(35) }}"
            clamped_target: >-
              {% if heater_current_temp is number %}
                {% set unclamped = (heater_current_temp | float) + (boosted_diff | float) %}
                {{ ([min_temp, [unclamped, max_temp] | min] | max) | round(1) }}
              {% else %}
                {{ none }}
              {% endif %}
            current_setpoint: "{{ state_attr(heater_entity, 'temperature') }}"
        - alias: Only update heater if its current_temperature is valid and target setpoint changed
          if:
            - condition: template
              value_template: >-
                {{ clamped_target is number
                   and (
                     current_setpoint is not number
                     or ((clamped_target | float) - (current_setpoint | float)) | abs >= (change_threshold | float)
                   ) }}
          then:
            - action: climate.set_temperature
              target:
                entity_id: "{{ heater_entity }}"
              data:
                temperature: "{{ clamped_target }}"
