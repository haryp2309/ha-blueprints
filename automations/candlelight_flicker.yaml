blueprint:
  name: Candlelight / Flame Flicker Effect
  description: >-
    Animates one or more lights with an organic candlelight or fireplace
    flickering effect while a switch helper is on. Automatically snapshots all
    lights before starting and smoothly restores them to their exact previous
    state (including turning previously off lights back off) when the switch
    helper is turned off.
  domain: automation
  homeassistant:
    min_version: "2024.8.0"
  input:
    toggle_switch:
      name: Control switch helper
      description: >-
        Switch or input_boolean helper that starts the flicker effect when
        turned on and restores the lights when turned off.
      selector:
        entity:
          domain:
            - input_boolean
            - switch
          multiple: false
    target_lights:
      name: Lights
      description: >-
        One or more light entities to animate with the candlelight / flame
        flicker effect.
      selector:
        entity:
          domain: light
          multiple: true
    effect_style:
      name: Flame style
      description: >-
        Color palette and warmth style for the flickering flame effect.
      default: candlelight
      selector:
        select:
          options:
            - label: Candlelight (warm golden-amber)
              value: candlelight
            - label: Fireplace (deep orange-red embers)
              value: fireplace
            - label: Warm White (color temperature only)
              value: warm_white
    min_brightness_pct:
      name: Minimum brightness
      description: >-
        Lowest brightness percentage reached during flame dips.
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    max_brightness_pct:
      name: Maximum brightness
      description: >-
        Peak brightness percentage during bright flame swells.
      default: 70
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    min_flicker_ms:
      name: Minimum flicker interval
      description: >-
        Shortest delay (in milliseconds) between flicker updates.
      default: 400
      selector:
        number:
          min: 150
          max: 3000
          step: 50
          unit_of_measurement: ms
          mode: slider
    max_flicker_ms:
      name: Maximum flicker interval
      description: >-
        Longest delay (in milliseconds) between flicker updates.
      default: 1400
      selector:
        number:
          min: 200
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: slider
    independent_lights:
      name: Independent flicker per light
      description: >-
        When enabled, each light flickers with its own random intensity; when
        disabled, all lights pulse together.
      default: true
      selector:
        boolean:
    restore_transition:
      name: Restore transition duration
      description: >-
        Transition time (in seconds) when restoring lights to their previous
        state after the switch helper is turned off.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: slider
    automations_to_pause:
      name: Automations to pause
      description: >-
        (Optional) Automations (such as auto-brightness or Adaptive Lighting)
        to temporarily disable while the effect runs and restore afterward.
      default: []
      selector:
        entity:
          domain: automation
          multiple: true

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input toggle_switch
    to: "on"

variables:
  toggle_switch: !input toggle_switch
  target_lights: !input target_lights
  effect_style: !input effect_style
  min_brightness_pct: !input min_brightness_pct
  max_brightness_pct: !input max_brightness_pct
  min_flicker_ms: !input min_flicker_ms
  max_flicker_ms: !input max_flicker_ms
  independent_lights: !input independent_lights
  restore_transition: !input restore_transition
  automations_to_pause: !input automations_to_pause
  snapshot_scene_id: >-
    candlelight_snapshot_{{ (this.entity_id | default('candlelight', true)) | replace('automation.', '') | slugify }}
  snapshot_scene_entity: "scene.{{ snapshot_scene_id }}"

action:
  - variables:
      paused_automations: "{{ automations_to_pause | select('is_state', 'on') | list }}"
      min_b: "{{ min_brightness_pct | float(20) }}"
      max_b: "{{ [min_b | float, max_brightness_pct | float(70)] | max }}"
      min_ms: "{{ min_flicker_ms | int(400) }}"
      max_ms: "{{ [min_ms | int, max_flicker_ms | int(1400)] | max }}"

  - alias: Pause conflicting automations if currently enabled
    if:
      - condition: template
        value_template: "{{ paused_automations | count > 0 }}"
    then:
      - action: automation.turn_off
        target:
          entity_id: "{{ paused_automations }}"
        data:
          stop_actions: true

  - alias: Snapshot current light states before starting effect
    action: scene.create
    data:
      scene_id: "{{ snapshot_scene_id }}"
      snapshot_entities: "{{ target_lights }}"

  - alias: Flicker lights while control switch is on
    repeat:
      while:
        - condition: state
          entity_id: !input toggle_switch
          state: "on"
      sequence:
        - variables:
            step_ms: "{{ range(min_ms | int, (max_ms | int) + 1) | random }}"
            step_transition: "{{ (((step_ms | float) / 1000) * 0.85) | round(2) }}"
            shared_intensity: >-
              {% set roll = range(0, 100) | random %}
              {% if roll < 10 %}
                {{ (range(0, 31) | random) / 100 }}
              {% elif roll < 30 %}
                {{ (range(25, 66) | random) / 100 }}
              {% else %}
                {{ (range(55, 101) | random) / 100 }}
              {% endif %}

        - repeat:
            for_each: "{{ target_lights }}"
            sequence:
              - variables:
                  light_entity: "{{ repeat.item }}"
                  light_available: "{{ states(light_entity) not in ['unavailable', 'unknown'] }}"
                  modes: "{{ state_attr(light_entity, 'supported_color_modes') | default([], true) }}"
                  supports_color: >-
                    {{ (modes | select('in', ['hs', 'rgb', 'rgbw', 'rgbww', 'xy']) | list | count) > 0 }}
                  supports_ct: "{{ 'color_temp' in modes }}"
                  supports_brightness: "{{ supports_color or supports_ct or ('brightness' in modes) }}"
                  intensity: >-
                    {% if independent_lights %}
                      {% set roll = range(0, 100) | random %}
                      {% if roll < 10 %}
                        {{ (range(0, 31) | random) / 100 }}
                      {% elif roll < 30 %}
                        {{ (range(25, 66) | random) / 100 }}
                      {% else %}
                        {{ (range(55, 101) | random) / 100 }}
                      {% endif %}
                    {% else %}
                      {{ shared_intensity | float }}
                    {% endif %}
                  target_brightness: "{{ (min_b + (max_b - min_b) * (intensity | float)) | round(0) | int }}"

              - choose:
                  - alias: Animate RGB/HS color light
                    conditions:
                      - condition: template
                        value_template: "{{ light_available and supports_color and effect_style != 'warm_white' }}"
                    sequence:
                      - variables:
                          t: "{{ intensity | float }}"
                          hue_jitter: "{{ range(-2, 3) | random }}"
                          sat_jitter: "{{ range(-2, 3) | random }}"
                          target_hue: >-
                            {% if effect_style == 'fireplace' %}
                              {{ [6, [12 + 18 * t + hue_jitter, 36] | min] | max | round(1) }}
                            {% else %}
                              {{ [10, [22 + 13 * t + hue_jitter, 42] | min] | max | round(1) }}
                            {% endif %}
                          target_sat: >-
                            {% if effect_style == 'fireplace' %}
                              {{ [75, [98 - 14 * t + sat_jitter, 100] | min] | max | round(1) }}
                            {% else %}
                              {{ [65, [92 - 16 * t + sat_jitter, 100] | min] | max | round(1) }}
                            {% endif %}
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light_entity }}"
                        data:
                          brightness_pct: "{{ target_brightness }}"
                          hs_color: "{{ [target_hue | float, target_sat | float] }}"
                          transition: "{{ step_transition }}"

                  - alias: Animate color-temperature light
                    conditions:
                      - condition: template
                        value_template: "{{ light_available and supports_ct }}"
                    sequence:
                      - variables:
                          min_k: "{{ state_attr(light_entity, 'min_color_temp_kelvin') | int(2000) }}"
                          max_k: "{{ state_attr(light_entity, 'max_color_temp_kelvin') | int(6500) }}"
                          warm_span: "{{ [0, [500, max_k - min_k] | min] | max }}"
                          target_kelvin: "{{ (min_k + warm_span * (intensity | float)) | round(0) | int }}"
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light_entity }}"
                        data:
                          brightness_pct: "{{ target_brightness }}"
                          color_temp_kelvin: "{{ target_kelvin }}"
                          transition: "{{ step_transition }}"

                  - alias: Animate dimmable-only light
                    conditions:
                      - condition: template
                        value_template: "{{ light_available and supports_brightness }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light_entity }}"
                        data:
                          brightness_pct: "{{ target_brightness }}"
                          transition: "{{ step_transition }}"

        - alias: Wait for next flicker step or exit immediately when switch turns off
          if:
            - condition: state
              entity_id: !input toggle_switch
              state: "on"
          then:
            - wait_for_trigger:
                - platform: state
                  entity_id: !input toggle_switch
                  to: "off"
              timeout:
                milliseconds: "{{ step_ms }}"
              continue_on_timeout: true

  - alias: Restore lights to their previous state
    action: scene.turn_on
    target:
      entity_id: "{{ snapshot_scene_entity }}"
    data:
      transition: "{{ restore_transition | float(1) }}"

  - alias: Delete temporary snapshot scene
    action: scene.delete
    target:
      entity_id: "{{ snapshot_scene_entity }}"
    continue_on_error: true

  - alias: Restore paused automations
    if:
      - condition: template
        value_template: "{{ paused_automations | count > 0 }}"
    then:
      - action: automation.turn_on
        target:
          entity_id: "{{ paused_automations }}"
